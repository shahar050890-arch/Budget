name: בדיקות ופרסום לאתר

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פרסום אחד בכל רגע נתון; לא מבטלים פרסום שכבר רץ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: בדיקות לוגיקה
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: הרצת הבדיקות
        run: node tests/logic.test.js

  deploy:
    name: פרסום ל-GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: הפעלת Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: אריזת האתר
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: פרסום
        id: deployment
        uses: actions/deploy-pages@v4
